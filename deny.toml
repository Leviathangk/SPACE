# cargo-deny checks the resolved third-party graph alongside cargo-vet.
# SPACE's Apache-2.0 license and planned contributor CLA do not determine the
# licenses of dependencies; this list covers permissive terms in the graph.
[licenses]
include-dev = true
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# These packages distribute CA certificate data under the CDLA permissive data
# license. Keep this exception narrow so other uses get explicit review.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
ignore = [
    # unsafe-libyaml is unmaintained (archived upstream, no CVE). It reaches us
    # only via datadog-opentelemetry -> libdd-library-config -> serde_yaml.
    # libdatadog switched libdd-library-config to the maintained `yaml_serde`
    # on 2026-10-06 (https://github.com/DataDog/libdatadog/pull/1770), but no
    # release carries it yet. Once a datadog-opentelemetry release depends on
    # that libdd-library-config, upgrade our Datadog version and remove this.
    { id = "RUSTSEC-2024-0449", reason = "transitive via datadog-opentelemetry; fixed upstream in libdatadog#1770, awaiting release" },
]
