name: Archcheck report

# Keeps one comment on each pull request that lists its archcheck findings
# (crates/tools/archcheck), including pull requests from forks. Informational:
# not a required check and not part of any aggregate.
#
# pull_request_target runs this file with the base branch's code and a token
# that can write pull request comments. That is only safe while no code from
# the pull request runs. Its head is checked out into pr/ and read as data:
# archcheck is built from trusted/ (the base branch, whose toolchain file and
# Cargo config apply) and given pr/ as --root. Nothing runs with pr/ as its
# working directory, nothing from pr/ is executed, no git command runs in pr/,
# and this job saves no cache, because a cache written here would land in the
# base branch's scope.
#
# For now the pull request's own ARCHITECTURE.toml and baseline are used, the
# same input as the Rust clippy job's archcheck step.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: archcheck-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    if: github.repository == 'perplexityai/SPACE'
    name: Archcheck report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false

      - name: Check out the pull request head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      # rustup and cargo read trusted/rust-toolchain.toml and
      # trusted/.cargo/config.toml, never the pull request's copies.
      - name: Build archcheck from the base branch
        working-directory: trusted
        run: |
          rustup toolchain install --no-self-update
          cargo build --locked --release -p pplx-space-archcheck --target-dir "$RUNNER_TEMP/archcheck"

      # The report covers only the files the pull request changes, so it is
      # not told about findings already on main. The list comes from the API,
      # with both sides of every rename, rather than from git in pr/. GitHub
      # lists at most 3,000 files, and a name with a line break cannot be put
      # in the list; in either case the whole tree is reported. Only the
      # number of files is logged: the names come from the pull request.
      - name: List the pull request's changed files
        id: changed-files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/archcheck-pr-files.jsonl"
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | [.filename, .previous_filename] | @json' >"$files"
          listed="$(wc -l <"$files")"
          if [ "$listed" -lt "$CHANGED_FILES" ] || jq -s -e 'any(.[][]; strings | test("[\r\n]"))' "$files" >/dev/null; then
            echo "archcheck: reporting the whole tree; GitHub listed ${listed} of ${CHANGED_FILES} changed files."
            echo "scope=tree" >>"$GITHUB_OUTPUT"
          else
            jq -r '.[0], (.[1] // empty)' "$files" >"$RUNNER_TEMP/archcheck-changed-files"
            echo "archcheck: reporting findings in the ${listed} files this pull request changes."
            echo "scope=changed" >>"$GITHUB_OUTPUT"
          fi

      # Exit 1 (a required-mode finding) is reported like any other finding;
      # the Rust clippy job is what fails on it. Exit 2 (a configuration, usage
      # or I/O error) fails this job and posts no comment.
      - name: Check the pull request head
        env:
          SCOPE: ${{ steps.changed-files.outputs.scope }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/archcheck-report.md"
          args=(--root "$GITHUB_WORKSPACE/pr" --format markdown)
          if [ "$SCOPE" = changed ]; then
            args+=(--changed-files "$RUNNER_TEMP/archcheck-changed-files")
          fi
          status=0
          "$RUNNER_TEMP/archcheck/release/archcheck" "${args[@]}" >"$report" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "::error title=archcheck::archcheck exited $status; no comment was posted."
            exit "$status"
          fi
          cat "$report" >>"$GITHUB_STEP_SUMMARY"

      - name: Update the pull request comment
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          bash ci/scripts/archcheck-pr-comment.sh --repo "$REPOSITORY" --pr "$PR_NUMBER"
          --sha "$HEAD_SHA" --report "$RUNNER_TEMP/archcheck-report.md"
