# Object store — local S3-compatible endpoint for the KinD SPACE stack.
#
# Versity S3 Gateway (versitygw, Apache-2.0) serving its POSIX backend from a
# node-local hostPath: each bucket is a directory and each object a file, with
# object metadata (ETag, content type, user metadata) in extended attributes.
# volume-manager (real, on its node DaemonSet) uploads/pulls
# suspend-restore snapshot artifacts here via the production object-store
# crate with an S3 endpoint override + path-style addressing, and the
# space-seed-publish Job publishes template releases with the aws CLI. Nothing
# here is a stub.
#
# Replaces SeaweedFS: one Go process with no master/volume/filer split, no
# volume slots to exhaust and no per-collection volume growth.

image:
  repository: ghcr.io/versity/versitygw
  # Bump to the first release that contains versity/versitygw#2415, and
  # change its ci/mirrored-images.txt line, which pins this tag's
  # linux/amd64 digest, with it. Through v1.8.0 the gateway commits a
  # truncated UNSIGNED-PAYLOAD PutObject or UploadPart body as complete when
  # the client disconnects mid-body (versity/versitygw#2414); the
  # object-store crate's Content-MD5 on every upload is what rejects those
  # bodies today, and it stays after the bump as defense in depth.
  tag: "v1.8.0"
  pullPolicy: IfNotPresent

# How node services get credentials for this store, set by every bring-up
# path from SPACE_KIND_STORAGE_CREDENTIALS (infra/space/kind/lib/storage-credentials.sh).
# `static` runs versitygw, whose root keys (`credentials` below) the node
# services read. `exchange` runs RustFS (`rustfs` below), which serves STS
# AssumeRole on the S3 port and enforces each session's policy on every S3
# request, so the credential-manager authority can vend exact-object sessions
# as deployments do. The two keep their data in different directories and
# share none.
storageCredentials: static

# The bucket-init Job creates the buckets through the S3 API with the aws CLI
# image CI already mirrors (ci/mirrored-images.txt).
bucketInitImage:
  repository: public.ecr.aws/aws-cli/aws-cli
  tag: "2.27.41"
  pullPolicy: IfNotPresent

datadogTeam: team-space

service:
  name: object-store
  # S3 API port (the only one vol-mgr talks to). Kept at SeaweedFS's 8333 so
  # host port-forwards and S3_ENDPOINT defaults are unchanged.
  s3Port: 8333

# Health endpoint versitygw serves on the S3 port (`--health`). Probes use it.
healthPath: /healthz

# Signing region the gateway validates (SigV4 is strict about region).
region: us-east-1

# Dev-only S3 credentials: the store's root account in both modes, so sigv4
# is actually validated. Handed as static creds (SPACE_OBJECT_STORE_STATIC_*)
# to volume-manager in `static` mode, and in both modes to build-manager,
# cluster-controller and the bucket-init and seed-publish Jobs. Do NOT put the
# substring "space" (or "minio") anywhere in these values: Tilt redacts secret
# VALUES from command lines (including docker build-args), so a "space"
# substring would poison every `docker build … space-rust-build-… …`
# invocation. See space-postgres values.
credentials:
  accessKey: localadmin
  secretKey: localadmin-dev-secret

# Buckets created by the init Job. `snapshots` carries suspend/restore
# artifacts (volume-manager push/pull); `templates` carries template release
# artifacts published by the space-seed-publish Job and pulled by worker
# template-managers.
snapshotBucket: snapshots
templateBucket: templates

# Object data lives on this node-local hostPath (see templates/deployment.yaml).
dataHostPath: /var/lib/space-object-store

# Extra versitygw global flags (before the `posix` backend subcommand).
# `--pprof` serves Go profiles on loopback only, for stall diagnostics
# (`kubectl exec … wget -qO- 127.0.0.1:6060/debug/pprof/goroutine?debug=2`).
extraArgs:
  - --pprof
  - 127.0.0.1:6060

# Scheduling priority (infra/space/kind/manifests/priorityclasses.yaml).
priorityClassName: space-control-plane

# The bucket-init Job is idempotent and re-runnable: replaceable.
bucketInitPriorityClassName: space-replaceable

# Object store placed on the infra node so a sandbox-worker drain never
# disturbs it.
nodeSelector:
  space.pplx.net/infra: "true"

# Small requests so the infra node fits the rest of the stack; the limits
# hold through the full Kind suites, whose heaviest gateway work is memory
# file uploads and multipart completion.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 4Gi

# RustFS, the `exchange` store: one Rust process (Apache-2.0) serving a
# single-drive store over a node-local hostPath. Its S3 port also answers STS
# AssumeRole with MinIO's semantics: the caller must be an IAM user, the
# session's permissions are that user's policy intersected with the request's
# session policy, and RoleArn is not checked. Each session policy is enforced
# on every S3 request, with multipart calls under `s3:PutObject` and
# HeadObject under `s3:GetObject`, as AWS authorizes them. See
# scratch/rustfs-bakeoff/REPORT.md for how it compared with versitygw.
rustfs:
  image:
    repository: docker.io/rustfs/rustfs
    tag: "1.0.1"
    # The 1.0.1 release's multi-arch index; ghcr.io/rustfs/rustfs serves the
    # same digest.
    digest: sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    pullPolicy: IfNotPresent
  # The image's unprivileged user, which must own the data directory.
  uid: 10001
  # Its own directory: RustFS's on-disk format is not versitygw's.
  dataHostPath: /var/lib/space-object-store-rustfs
  # Ready once storage and IAM have loaded; live while the process answers.
  readinessPath: /health/ready
  livenessPath: /health
  # RustFS's production default (warn) plus its per-request log line.
  logFilter: warn,rustfs::server::http=info
  # The role ARN the authority names. RustFS ignores it, but the authority
  # accepts only a 12-digit account
  # (crates/libs/credential/mgr/server/src/iam_role_arn.rs).
  accountId: "000000000000"
  vendRole: kind-storage-vend
  # The IAM user the authority signs AssumeRole with, and the name of its
  # user policy (templates/secret.yaml).
  vendPolicy: kind-storage-vend
  vendIdentity:
    accessKey: localvend
    secretKey: localvend-dev-secret
