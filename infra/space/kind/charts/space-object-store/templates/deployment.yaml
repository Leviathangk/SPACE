{{- $exchange := eq .Values.storageCredentials "exchange" -}}
{{- if not (has .Values.storageCredentials (list "static" "exchange")) }}
{{- fail (printf "storageCredentials must be static or exchange, not %q" .Values.storageCredentials) }}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: space-object-store
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-object-store
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.datadogTeam | quote }}
    # Which store this cluster was created with; the transition check
    # (infra/space/kind/scripts/check-object-store-transition.sh) refuses a
    # bring-up that would switch it, because the stores share no data.
    space.pplx.net/kind-storage-credentials: {{ .Values.storageCredentials | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: space-object-store
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    # Single gateway over one data dir; never two replicas (object publishes
    # take advisory lock files that are only safe within one process).
    type: Recreate
  template:
    metadata:
      annotations:
        ad.datadoghq.com/tags: '{"team":"{{ .Values.datadogTeam }}"}'
      labels:
        app.kubernetes.io/name: space-object-store
        app.kubernetes.io/instance: {{ .Release.Name }}
        team: {{ .Values.datadogTeam | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: {{ .Values.priorityClassName }}
      terminationGracePeriodSeconds: 10
{{- if $exchange }}
{{- $rf := .Values.rustfs }}
      initContainers:
        # RustFS runs as its image's unprivileged user, and a hostPath that
        # DirectoryOrCreate makes is root-owned, so hand the data directory
        # to that user before the server starts. Idempotent on a restart.
        - name: data-owner
          image: "{{ $rf.image.repository }}:{{ $rf.image.tag }}@{{ $rf.image.digest }}"
          imagePullPolicy: {{ $rf.image.pullPolicy }}
          command: ["/bin/sh", "-c", "chown {{ $rf.uid }}:{{ $rf.uid }} /data && chmod 0750 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: object-store
          image: "{{ $rf.image.repository }}:{{ $rf.image.tag }}@{{ $rf.image.digest }}"
          imagePullPolicy: {{ $rf.image.pullPolicy }}
          # One single-drive server over the data directory. Its S3 port also
          # answers STS AssumeRole (POST /, Action=AssumeRole). The root
          # account is the admin keys below; the bucket-init Job creates the
          # vend identity and its policy through the admin API on the same
          # port.
          env:
            - name: RUSTFS_ADDRESS
              value: ":{{ .Values.service.s3Port }}"
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_REGION
              value: {{ .Values.region | quote }}
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: space-object-store
                  key: SPACE_OBJECT_STORE_STATIC_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: space-object-store
                  key: SPACE_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            # Logs to stdout rather than files under /logs, with one line per
            # completed request, as versitygw prints by default. RustFS
            # demotes its request log to WARN unless the target is named.
            - name: RUSTFS_OBS_LOG_STDOUT_ENABLED
              value: "true"
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
            - name: RUST_LOG
              value: {{ $rf.logFilter | quote }}
          ports:
            - name: s3
              containerPort: {{ .Values.service.s3Port }}
              protocol: TCP
          # Ready once storage and IAM are loaded (about half a second on an
          # idle node). Fails slowly for the same reason as versitygw's below.
          readinessProbe:
            httpGet:
              path: {{ $rf.readinessPath }}
              port: s3
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: {{ $rf.livenessPath }}
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # hostPath for the same reason as versitygw's below, in its own
        # directory: RustFS's on-disk format is its own.
        - name: data
          hostPath:
            path: {{ $rf.dataHostPath }}
            type: DirectoryOrCreate
{{- else }}
      containers:
        - name: object-store
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Global flags precede the `posix` backend subcommand. The POSIX
          # backend stores object metadata in user.* xattrs. The data hostPath
          # is under the node's /var, which kind mounts as an anonymous Docker
          # volume on every node (no extraMount covers this path), so the
          # xattrs land on the filesystem backing that volume, not on the
          # node's overlay root.
          args:
            - --port
            - ":{{ .Values.service.s3Port }}"
            - --health
            - {{ .Values.healthPath | quote }}
            - --region
            - {{ .Values.region | quote }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
            - posix
            - /data
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: space-object-store
                  key: SPACE_OBJECT_STORE_STATIC_ACCESS_KEY_ID
            - name: ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: space-object-store
                  key: SPACE_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY
          ports:
            - name: s3
              containerPort: {{ .Values.service.s3Port }}
              protocol: TCP
          # The gateway binds in well under a second, so readiness starts
          # early, but it fails slowly on purpose: this is the Service's only
          # endpoint, and dropping it during a transient stall turns every
          # client retry into a fast "connection refused" instead of letting
          # the stall pass (5 s x 12, a 60 s budget).
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: s3
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # hostPath (not emptyDir): the gateway is pinned to the infra node via
        # nodeSelector, and object data must survive a pod restart — an
        # emptyDir wipe loses the published seed + every suspend snapshot,
        # which strands template pulls and cross-node restores until a manual
        # re-publish. The node-local dir persists across pod rolls, and with
        # the POSIX backend the buckets themselves are directories in it.
        - name: data
          hostPath:
            path: {{ .Values.dataHostPath }}
            type: DirectoryOrCreate
{{- end }}
