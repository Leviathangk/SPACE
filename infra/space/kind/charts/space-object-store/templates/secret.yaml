apiVersion: v1
kind: Secret
metadata:
  name: space-object-store
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-object-store
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # The store's root account (ROOT_ACCESS_KEY / ROOT_SECRET_KEY for versitygw,
  # RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY for RustFS), so sigv4-signed
  # requests are actually validated. Consumers read it as static S3
  # credentials, the local-dev escape hatch that bypasses credential-manager's
  # exchange (crates/libs/vol/mgr/server/src/run.rs): volume-manager in
  # `static` mode only, build-manager and cluster-controller in both.
  SPACE_OBJECT_STORE_STATIC_ACCESS_KEY_ID: {{ .Values.credentials.accessKey | quote }}
  SPACE_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY: {{ .Values.credentials.secretKey | quote }}
  {{- if eq .Values.storageCredentials "exchange" }}
  {{- $rf := .Values.rustfs }}
  # The credential-manager authority's base credentials for AssumeRole (its
  # AWS default chain) and the role it names (SPACE_CREDMGR_S3_VEND_ROLE_ARN).
  # RustFS has no roles: it accepts any well-formed RoleArn and gives the
  # session its caller's own policy intersected with the session policy, so
  # the role here only has to satisfy the authority's ARN check.
  STORAGE_VEND_ACCESS_KEY_ID: {{ $rf.vendIdentity.accessKey | quote }}
  STORAGE_VEND_SECRET_ACCESS_KEY: {{ $rf.vendIdentity.secretKey | quote }}
  STORAGE_VEND_ROLE_ARN: {{ printf "arn:aws:iam::%s:role/%s" $rf.accountId $rf.vendRole | quote }}
  # The vend identity's user policy, which the bucket-init Job installs: read,
  # write and abort uploads of objects in the two buckets, and list them;
  # nothing else. It bounds every vended session from above, and the
  # authority's exact-object session policy
  # (AuthorizedExchange::session_policy,
  # crates/libs/credential/mgr/server/src/storage_exchange.rs) narrows each
  # one to its object. Unlike an AWS role, it also applies to the identity's
  # own keys, which only the authority holds.
  vend-policy.json: |
    {{- $buckets := list .Values.snapshotBucket .Values.templateBucket }}
    {{- $objects := list }}
    {{- range $buckets }}{{ $objects = append $objects (printf "arn:aws:s3:::%s/*" .) }}{{ end }}
    {{- $bucketArns := list }}
    {{- range $buckets }}{{ $bucketArns = append $bucketArns (printf "arn:aws:s3:::%s" .) }}{{ end }}
    {{- dict "Version" "2012-10-17"
             "Statement" (list
               (dict "Effect" "Allow" "Action" (list "s3:GetObject" "s3:PutObject" "s3:AbortMultipartUpload") "Resource" $objects)
               (dict "Effect" "Allow" "Action" (list "s3:ListBucket") "Resource" $bucketArns)) | toJson | nindent 4 }}
  {{- end }}
