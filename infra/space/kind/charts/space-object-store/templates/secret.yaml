apiVersion: v1
kind: Secret
metadata:
  name: space-object-store
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-object-store
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # The store's root account (ROOT_ACCESS_KEY / ROOT_SECRET_KEY for versitygw,
  # the admin identity for SeaweedFS), so sigv4-signed requests are actually
  # validated. Consumers read it as static S3 credentials, the local-dev escape
  # hatch that bypasses credential-manager's exchange
  # (crates/libs/vol/mgr/server/src/run.rs): volume-manager in `static` mode
  # only, build-manager and cluster-controller in both.
  SPACE_OBJECT_STORE_STATIC_ACCESS_KEY_ID: {{ .Values.credentials.accessKey | quote }}
  SPACE_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY: {{ .Values.credentials.secretKey | quote }}
  {{- if eq .Values.storageCredentials "exchange" }}
  {{- $sw := .Values.seaweedfs }}
  # The credential-manager authority's base credentials for AssumeRole (its
  # AWS default chain) and the role it assumes
  # (SPACE_CREDMGR_S3_VEND_ROLE_ARN). This identity can only assume the vend
  # role; every S3 request needs a vended session.
  STORAGE_VEND_ACCESS_KEY_ID: {{ $sw.vendIdentity.accessKey | quote }}
  STORAGE_VEND_SECRET_ACCESS_KEY: {{ $sw.vendIdentity.secretKey | quote }}
  STORAGE_VEND_ROLE_ARN: {{ printf "arn:aws:iam::%s:role/%s" $sw.accountId $sw.vendRole | quote }}
  # SeaweedFS's S3 identities (-s3.config): the root account with every
  # action, and the vend identity with none.
  s3.json: |
    {{- dict "identities" (list
          (dict "name" "root"
                "credentials" (list (dict "accessKey" .Values.credentials.accessKey "secretKey" .Values.credentials.secretKey))
                "actions" (list "Admin" "Read" "Write" "List" "Tagging"))
          (dict "name" $sw.vendIdentity.name
                "credentials" (list (dict "accessKey" $sw.vendIdentity.accessKey "secretKey" $sw.vendIdentity.secretKey))
                "actions" (list))) | toPrettyJson | nindent 4 }}
  # SeaweedFS's IAM and STS configuration (-s3.iam.config). The vend role may
  # read, write and abort uploads of objects in the two buckets and list
  # them, and only the vend identity may assume it. A vended session gets the
  # intersection of this and the authority's exact-object session policy
  # (AuthorizedExchange::session_policy,
  # crates/libs/credential/mgr/server/src/storage_exchange.rs). The STS
  # signing key is the store's own, filled in at start
  # (templates/deployment.yaml), so none is rendered or committed.
  iam.json.tmpl: |
    {{- $buckets := list .Values.snapshotBucket .Values.templateBucket }}
    {{- $objects := list }}
    {{- range $buckets }}{{ $objects = append $objects (printf "arn:aws:s3:::%s/*" .) }}{{ end }}
    {{- $bucketArns := list }}
    {{- range $buckets }}{{ $bucketArns = append $bucketArns (printf "arn:aws:s3:::%s" .) }}{{ end }}
    {{- dict
          "sts" (dict "tokenDuration" "1h" "maxSessionLength" "12h" "issuer" "space-kind-object-store" "signingKey" "@STS_SIGNING_KEY@")
          "policies" (list (dict "name" "kind-storage-vend"
                                 "document" (dict "Version" "2012-10-17"
                                                  "Statement" (list
                                                    (dict "Effect" "Allow" "Action" (list "s3:GetObject" "s3:PutObject" "s3:AbortMultipartUpload") "Resource" $objects)
                                                    (dict "Effect" "Allow" "Action" (list "s3:ListBucket") "Resource" $bucketArns)))))
          "roles" (list (dict "roleName" $sw.vendRole
                              "roleArn" (printf "arn:aws:iam::%s:role/%s" $sw.accountId $sw.vendRole)
                              "attachedPolicies" (list "kind-storage-vend")
                              "trustPolicy" (dict "Version" "2012-10-17"
                                                  "Statement" (list (dict "Effect" "Allow"
                                                                          "Principal" (dict "AWS" (printf "arn:aws:iam::%s:user/%s" $sw.accountId $sw.vendIdentity.name))
                                                                          "Action" "sts:AssumeRole"))))) | toPrettyJson | nindent 4 }}
  {{- end }}
