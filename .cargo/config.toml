[alias]
lint = "clippy --workspace --locked -- -D warnings"
# A separate target directory keeps `cargo arch` from waiting on the build-directory
# lock held by a concurrent workspace build.
arch = "run -q --locked -p pplx-space-archcheck --target-dir target/archcheck --"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
rustflags = [
  "-C", "link-arg=-fuse-ld=mold",
]

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
rustflags = [
  "-C", "link-arg=-fuse-ld=mold",
]
