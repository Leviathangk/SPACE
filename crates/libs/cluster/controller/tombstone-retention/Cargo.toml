[package]
name = "pplx-space-cluster-controller-tombstone-retention"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[[test]]
name = "retention"
path = "retention.test.rs"

[lints]
workspace = true

[dependencies]
pplx-space-common-core = { workspace = true, features = ["sqlx"] }
pplx-space-cluster-pool = { workspace = true }
pplx-space-metrics = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-test-env = { workspace = true }
